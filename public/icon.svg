<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="200" y1="80" x2="312" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="120" y1="180" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Coin Entering Slit -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="140" r="64" fill="url(#coinGrad)" stroke="#a16207" stroke-width="4" />
    <circle cx="256" cy="140" r="48" fill="none" stroke="#fef08a" stroke-width="3" stroke-dasharray="8 4" />
    <text x="256" y="152" font-size="36" font-family="system-ui, sans-serif" font-weight="900" fill="#78350f" text-anchor="middle">Rp</text>
  </g>

  <!-- Jimpitan Box / Celengan Bambu/Tabungan Kas -->
  <g filter="url(#shadow)">
    <!-- Main Pot / Box -->
    <rect x="120" y="210" width="272" height="220" rx="32" fill="url(#boxGrad)" stroke="#cbd5e1" stroke-width="4" />
    
    <!-- Slit on Top -->
    <rect x="200" y="198" width="112" height="24" rx="8" fill="#1e293b" />
    <rect x="220" y="206" width="72" height="8" rx="4" fill="#0f172a" />

    <!-- Class School Badge Motif -->
    <rect x="156" y="250" width="200" height="96" rx="16" fill="#0f766e" fill-opacity="0.1" stroke="#0f766e" stroke-width="2" stroke-dasharray="6 4" />
    
    <!-- Jimpitan Icon Text -->
    <path d="M220 285 L256 265 L292 285 L256 305 Z" fill="#0f766e" />
    <path d="M224 290 L224 315 C224 325 288 325 288 315 L288 290" stroke="#0f766e" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M292 288 L302 300 L292 312" stroke="#0f766e" stroke-width="3" fill="none" stroke-linecap="round" />

    <text x="256" y="380" font-size="22" font-family="system-ui, sans-serif" font-weight="800" fill="#0f766e" text-anchor="middle" letter-spacing="2">KAS SEKOLAH</text>
    <text x="256" y="405" font-size="14" font-family="system-ui, sans-serif" font-weight="600" fill="#64748b" text-anchor="middle">JIMPITAN KELAS</text>
  </g>
</svg>
